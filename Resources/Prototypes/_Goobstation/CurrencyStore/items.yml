# test that tokens work at all
- type: currencyStoreItem
  id: DebugNoOp
  name: currencystore-item-noop-name
  description: currencystore-item-noop-desc
  category: Debug
  price: 0
  effects: []

# test effects work properly
- type: currencyStoreItem
  id: DebugGibstick
  name: currencystore-item-gibstick-name
  description: currencystore-item-gibstick-desc
  redeemable: inround
  category: Debug
  price: 10000
  priceIncrease: 10000
  priceDecrease: 1000
  immediate: true
  conditions:
  - !type:CurrencyStoreLivingCondition
  effects:
  - !type:CurrencyStoreGiveItemEffect
    prototype: MeleeDebugGib

# test multiple uses work properly
- type: currencyStoreItem
  id: DebugHeavy
  name: currencystore-item-heavy-name
  description: currencystore-item-heavy-desc
  category: Debug
  price: 500
  maxUses: 5
  effects: []

# test preround immediate tokens
- type: currencyStoreItem
  id: DebugBrokenScheduler
  name: currencystore-item-broken-scheduler-name
  description: currencystore-item-broken-scheduler-desc
  category: Debug
  price: 30000
  redeemable: preround
  immediate: true
  effects:
  - !type:CurrencyStoreSetPresetEffect
    prototype: TheGuide

# test that permanent items work correctly
- type: currencyStoreItem
  id: DebugPermanentExample
  permanent: true
  name: currencystore-item-permanent-example-name
  description: currencystore-item-permanent-example-desc
  category: Debug
  price: 1000
  effects: []
